services:
  api:
    build: .
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DEMO_MODE: ${DEMO_MODE:-true}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-120}
      JWT_SECRET: ${JWT_SECRET:-local-only-demo-secret-change-me-please-32-chars}
      SESSION_SECRET: ${SESSION_SECRET:-local-only-session-secret-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      LAB_VULNERABLE_MODES: ${LAB_VULNERABLE_MODES:-true}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_RETURN_TO: ${OIDC_RETURN_TO:-}
      OIDC_ADMIN_EMAILS: ${OIDC_ADMIN_EMAILS:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped
